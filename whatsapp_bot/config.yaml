---
name: WhatsApp Bot
version: "2.1.1"
slug: whatsapp_bot
description: >-
  A modular WhatsApp bot (whatsapp-web.js) with a command registry,
  persistent pairing session and self-healing reconnects.
url: https://github.com/basekkelenkamp/whatsapp-bot
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
# Restarted by the Supervisor whenever /health stops answering or the
# container dies. This is the outer safety net; the bot also heals itself.
watchdog: "http://[HOST]:8099/health"
ingress: true
ingress_port: 8099
panel_icon: mdi:whatsapp
panel_title: WhatsApp Bot
# Read-only access to /share, where the Google service account key is kept. A
# secret does not belong in the add-on options, where the UI shows it in clear.
map:
  - share:ro
options:
  log_level: info
  command_prefix: "/"
  listen_to: all
  allowed_chats: []
  timezone: Europe/Amsterdam
  locale: en-GB
  health_check_interval: 60
  plansesh:
    question: when sesh?
    default_weeks: 1
    max_weeks: 8
    allow_multiple_answers: true
  gdrive:
    enabled: false
    folder_id: ""
    chat: ""
    poll_interval: 300
    service_account_key_file: /share/whatsapp-bot-drive-key.json
    service_account_json: ""
schema:
  log_level: list(trace|debug|info|warn|error)
  command_prefix: str
  listen_to: list(all|self|others)
  allowed_chats:
    - str
  timezone: str
  locale: str
  health_check_interval: int(15,3600)
  plansesh:
    question: str
    default_weeks: int(1,52)
    max_weeks: int(1,52)
    allow_multiple_answers: bool
  gdrive:
    enabled: bool
    folder_id: str?
    chat: str?
    poll_interval: int(60,86400)
    service_account_key_file: str?
    service_account_json: password?
